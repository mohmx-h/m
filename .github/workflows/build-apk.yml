name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app project (when uploaded as app-project.zip)
        run: |
          if [ -f app-project.zip ]; then unzip -q -o app-project.zip 'android/*' -d . ; fi
          test -f android/settings.gradle || (echo "android folder not found: upload app-project.zip to the repo root" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the site files into the app
        run: |
          mkdir -p android/app/src/main/assets/web
          rsync -a --exclude='.git' --exclude='.github' --exclude='android' --exclude='*.zip' --exclude='*.rules' --exclude='sitemap.xml' --exclude='robots.txt' ./ android/app/src/main/assets/web/

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Mohomx-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
