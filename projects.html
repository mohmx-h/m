  <script>
    tailwind.config={
      darkMode:'class',
      theme:{
        extend:{
          fontFamily:{
            display:['PT Sans','sans-serif'],
            body:['DM Sans','sans-serif']
          },
          colors:{
            accent:'#FF6B2B',
            'accent-light':'#FF8F5C'
          }
        }
      }
    }

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{
      box-sizing:border-box;
    }

    html{
      font-family:'DM Sans',sans-serif;
    }

    h1,h2,h3,h4,h5,h6{
      font-family:'PT Sans',sans-serif;
    }

    .reveal{
      opacity:0;
      transform:translateY(22px);
      transition:
        opacity .55s cubic-bezier(.4,0,.2,1),
        transform .55s cubic-bezier(.4,0,.2,1);
    }

    .reveal.visible{
      opacity:1;
      transform:translateY(0);
    }

    .nav-link{
      position:relative;
    }

    .nav-link::after{
      content:'';
      position:absolute;
      bottom:-2px;
      left:0;
      width:0;
      height:1.5px;
      background:currentColor;
      transition:width .25s cubic-bezier(.4,0,.2,1);
    }

    .nav-link:hover::after{
      width:100%;
    }

    ::-webkit-scrollbar{
      width:5px;
    }

    ::-webkit-scrollbar-track{
      background:transparent;
    }

    ::-webkit-scrollbar-thumb{
      background:#FF6B2B;
      border-radius:99px;
    }

    body{
      transition:background-color .3s,color .3s;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
      opacity:.4;
    }

    .btn-primary{
      position:relative;
      overflow:hidden;
    }

    .btn-primary::after{
      content:'';
      position:absolute;
      top:0;
      left:-100%;
      width:60%;
      height:100%;
      background:rgba(255,255,255,.18);
      transform:skewX(-20deg);
      transition:left .4s cubic-bezier(.4,0,.2,1);
    }

    .btn-primary:hover::after{
      left:160%;
    }

    [x-cloak]{
      display:none!important;
    }

    .photo-frame{
      position:relative;
      overflow:hidden;
      background:#e4e4e7;
    }

    .photo-frame img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .project-card{
      transition:
        transform .3s cubic-bezier(.4,0,.2,1),
        border-color .2s;
    }

    .project-card:hover{
      transform:translateY(-4px);
    }
  </style>
</head>

                    :alt="p.title"

                  />

  :class="{
    'bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600': p.icon === 'instagram',
    'bg-red-600': p.icon === 'youtube',
    'bg-black': p.icon === 'tiktok'
  }"
>
  <i
    :class="{
      'fa-instagram': p.icon === 'instagram',
      'fa-youtube': p.icon === 'youtube',
      'fa-tiktok': p.icon === 'tiktok'

    class="fa-brands text-2xl text-white"
  ></i>
</div>
                </a>

                    ></h3>

                  </a>


                  <p

                  ></p>

    </section>

        get visibleCount() {

          if (this.filter === 'all')
            return this.allProjects.length;

          return this.allProjects.filter(
            p => p.category === this.filter
          ).length;

        },


        init() {

          this.dark =
            localStorage.getItem('theme') === 'dark'
            ||
            (
              !localStorage.getItem('theme')
              &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            );


          window.addEventListener(
            'scroll',
            () => {
              this.scrolled = window.scrollY > 20;
            },
            { passive:true }
          );


          this.$nextTick(() => {

            const obs = new IntersectionObserver(
              entries => {

                entries.forEach(e => {

                  if (e.isIntersecting) {

                    e.target.classList.add('visible');

                    obs.unobserve(e.target);

                  }

                });

              },
              {
                threshold:0.08,
                rootMargin:'0px 0px -30px 0px'
              }
            );


            document
              .querySelectorAll('.reveal')
              .forEach(el => obs.observe(el));

          });

        }

      }

    }


    document.getElementById('year').textContent =
      new Date().getFullYear();
